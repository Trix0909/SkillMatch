[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "tmp", "staticfiles", "docs/source-extracts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 100
preserve_blank_lines = true
format_css = false
format_js = false
