<div class="sp-field{% if field.errors %} sp-field-invalid{% endif %}">
  <label for="{{ field.id_for_label }}" class="form-label">
    {{ field.label }}{% if field.field.required %}<span class="required-mark"
      aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
  {% endif %}
  {{ field.errors }}
</div>
