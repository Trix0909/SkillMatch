<div class="cp-field">
  {% include "skillmatch/includes/profile_field.html" %}
  {% if field.field.widget.attrs.maxlength and field.field.widget.input_type != "text" and field.field.widget.input_type != "url" %}
    <p class="cp-counter"
       data-counter-for="{{ field.id_for_label }}">{{ field.value|default:''|length }}/{{ field.field.widget.attrs.maxlength }}</p>
  {% endif %}
</div>
