<form class="sd-save-form"
      method="post"
      action="{% if is_saved %}{% url 'job_unsave' job.pk %}{% else %}{% url 'job_save' job.pk %}{% endif %}">
  {% csrf_token %}
  <input type="hidden"
         name="next"
         value="{{ request.get_full_path }}{% if active == 'recommendations' %}#job-{{ job.pk }}{% endif %}">
  <button class="sd-save-button{% if is_saved %} is-saved{% endif %}"
          type="submit"
          aria-pressed="{{ is_saved|yesno:'true,false' }}"
          aria-label="{% if is_saved %}Remove saved job{% else %}Save job{% endif %}: {{ job.title }}"
          title="{% if is_saved %}Remove saved job{% else %}Save job{% endif %}">
    <svg width="19"
         height="19"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.7"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      <path d="M6 3h12v19l-6-5-6 5z" />
    </svg>
  </button>
</form>
