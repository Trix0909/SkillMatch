<svg class="sm-icon"
     width="24"
     height="24"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.6"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false">
  {% if icon == "home" %}
    <path d="m3 10 9-8 9 8v11h-6v-8H9v8H3z" />
  {% elif icon == "people" %}
    <circle cx="9" cy="7" r="3.5" />
    <path d="M2 21v-2a7 7 0 0 1 14 0v2M16 4a3.5 3.5 0 0 1 0 7m3 10v-2a6 6 0 0 0-2-4" />
  {% elif icon == "person" or icon == "person-add" %}
    <circle cx="11" cy="7" r="3.5" />
    <path d="M3 21v-2a8 8 0 0 1 13-6" />
    {% if icon == "person-add" %}
      <path d="M19 15v6m-3-3h6" />
    {% else %}
      <path d="M16 13a8 8 0 0 1 3 6v2" />
    {% endif %}
  {% elif icon == "building" %}
    <path d="M7 21V3h10v18M3 21h18M3 21V10h4m10 0h4v11M10 7h.01M14 7h.01M10 11h.01M14 11h.01M10 15h.01M14 15h.01M11 21v-3h2v3" />
  {% elif icon == "briefcase" %}
    <rect x="3" y="7" width="18" height="14" rx="2" />
    <path d="M8 7V3h8v4M8 7v3m8-3v3" />
  {% elif icon == "document" %}
    <path d="M5 2h9l5 5v15H5zM14 2v6h5M9 12h6M9 16h6M9 19h3" />
  {% elif icon == "layers" %}
    <path d="m2 7 10-5 10 5-10 5zM2 12l10 5 10-5M2 17l10 5 10-5" />
  {% elif icon == "chart" %}
    <path d="M3 21h19M5 17v-7m5 7V3m5 14v-5m5 5V5" />
  {% elif icon == "settings" %}
    <path d="m9 3 1-2h4l1 2 2 1 2-.2 2 3-1 2v3l1 2-2 3h-2l-2 1-1 3h-4l-1-3-2-1H5l-2-3 1-2V9L3 7l2-3h2z" transform="translate(0 1) scale(.95)" />
    <circle cx="11.5" cy="11.5" r="3" />
  {% elif icon == "search" %}
    <circle cx="10" cy="10" r="7" />
    <path d="m15 15 6 6" />
  {% elif icon == "bell" %}
    <path d="M5 9a7 7 0 0 1 14 0c0 8 3 8 3 9H2c0-1 3-1 3-9M9 22h6M12 0v2" />
  {% elif icon == "chevron" %}
    <path d="m7 10 5 5 5-5" />
  {% elif icon == "menu" %}
    <path d="M3 6h18M3 12h18M3 18h18" />
  {% else %}
    <path d="M4 12h16m-6-6 6 6-6 6" />
  {% endif %}
</svg>
