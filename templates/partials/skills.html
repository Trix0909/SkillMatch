<div class="field-group skill-editor" data-skill-editor><label class="form-label" for="skill-entry">{% if job %}Required skills{% else %}Skills{% endif %}<span class="required-mark"> *</span></label><p class="form-text mt-0">Add one skill at a time. Each skill appears only once.</p>{{ form.skills_json }}<div class="skill-entry"><input id="skill-entry" type="text" class="form-control" maxlength="80" placeholder="e.g. Python, bookkeeping, graphic design" autocomplete="off"><button type="button" class="btn btn-secondary" data-add-skill>+ Add skill</button></div><div class="skill-tags" data-skill-tags aria-label="Added skills"></div><div class="field-error" data-skill-error aria-live="polite"></div>{% for error in form.skills_json.errors %}<div class="field-error" role="alert">{{ error }}</div>{% endfor %}<noscript><p>JavaScript is needed to add and remove skill tags. Please enable it for this form.</p></noscript></div>
