name: SkillMatch validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Set up isolated development environment (Linux)
        if: runner.os != 'Windows'
        run: python tools/dev.py setup
      - name: Set up through the Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SKILLMATCH_NO_PAUSE: '1'
        run: start.cmd --setup-only
      - name: Lint, formatting, tests, migrations and repository checks
        run: python tools/dev.py check
